<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Givrex export reach</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Work+Sans:wght@400;500;600&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1E3A2B; overflow: hidden; }
  #map { display: block; width: 100%; height: 100vh; }
  .lbl { font-family: 'Work Sans', 'Almarai', system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; fill: #FBF7EE; }
  .lbl-origin { font-family: 'Work Sans', 'Almarai', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; fill: #E0B14E; }
</style>
</head>
<body>
<svg id="map"></svg>
<script>
const Q = new URLSearchParams(location.search).get("lang");
const LANG = (Q === "ar" || Q === "fr") ? Q : "en";
const ORIGIN = { name: "ALEXANDRIA", ar: "الإسكندرية", fr: "ALEXANDRIE", lon: 29.92, lat: 31.2 };
const AR = {
  "Canada": "كندا", "United States": "الولايات المتحدة", "United Kingdom": "المملكة المتحدة",
  "Netherlands": "هولندا", "Germany": "ألمانيا", "France": "فرنسا", "Spain": "إسبانيا",
  "Italy": "إيطاليا", "Lebanon": "لبنان", "Jordan": "الأردن", "Kuwait": "الكويت",
  "Qatar": "قطر", "UAE": "الإمارات", "Saudi Arabia": "السعودية", "Japan": "اليابان",
  "Australia": "أستراليا"
};
const FR = {
  "Canada": "Canada", "United States": "États-Unis", "United Kingdom": "Royaume-Uni",
  "Netherlands": "Pays-Bas", "Germany": "Allemagne", "France": "France", "Spain": "Espagne",
  "Italy": "Italie", "Lebanon": "Liban", "Jordan": "Jordanie", "Kuwait": "Koweït",
  "Qatar": "Qatar", "UAE": "Émirats arabes unis", "Saudi Arabia": "Arabie saoudite",
  "Japan": "Japon", "Australia": "Australie"
};
const TABLE = { ar: AR, fr: FR };
const nm = (d) => (TABLE[LANG] && TABLE[LANG][d.name]) || d.name;
const DEST = [
  { name: "Canada",         lon: -79.4,  lat: 43.7,  dx: -8,  dy: -14, anchor: "end" },
  { name: "United States",  lon: -74.0,  lat: 40.7,  dx: -8,  dy: 14,  anchor: "end" },
  { name: "United Kingdom", lon: -0.13,  lat: 51.5,  dx: -10, dy: -20, anchor: "end" },
  { name: "Netherlands",    lon: 4.9,    lat: 52.4,  dx: -6,  dy: -30, anchor: "end" },
  { name: "Germany",        lon: 13.4,   lat: 52.5,  dx: 12,  dy: -14, anchor: "start" },
  { name: "France",         lon: 2.35,   lat: 48.9,  dx: -14, dy: 12,  anchor: "end" },
  { name: "Spain",          lon: -3.7,   lat: 40.4,  dx: -12, dy: 14,  anchor: "end" },
  { name: "Italy",          lon: 12.5,   lat: 41.9,  dx: 6,   dy: -12, anchor: "start" },
  { name: "Lebanon",        lon: 35.5,   lat: 33.9,  gulf: 0 },
  { name: "Jordan",         lon: 35.9,   lat: 31.9,  gulf: 1 },
  { name: "Kuwait",         lon: 47.9,   lat: 29.4,  gulf: 2 },
  { name: "Qatar",          lon: 51.5,   lat: 25.3,  gulf: 3 },
  { name: "UAE",            lon: 55.3,   lat: 25.2,  gulf: 4 },
  { name: "Saudi Arabia",   lon: 46.7,   lat: 24.7,  gulf: 5 },
  { name: "Japan",          lon: 139.7,  lat: 35.7,  dx: 9,   dy: -8,  anchor: "start" },
  { name: "Australia",      lon: 151.2,  lat: -33.9, dx: 9,   dy: 8,   anchor: "start" }
];

const svg = d3.select("#map");
let W = 0, H = 0;

function arc(p0, p1) {
  const [x0, y0] = p0, [x1, y1] = p1;
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.hypot(dx, dy);
  const lift = Math.max(26, Math.min(dist * 0.3, 150));
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  const nx = -dy / (dist || 1), ny = dx / (dist || 1);
  const side = x1 < x0 ? 1 : -1;
  return `M${x0},${y0} Q${mx + nx * lift * side},${my + ny * lift * side} ${x1},${y1}`;
}

function render(countries) {
  const rect = document.body.getBoundingClientRect();
  W = rect.width; H = rect.height;
  svg.attr("viewBox", `0 0 ${W} ${H}`).selectAll("*").remove();

  const small = W < 620;
  const padL = small ? 10 : Math.max(30, W * 0.05);
  const padR = small ? 16 : Math.max(44, W * 0.07);
  const padY = small ? 2 : 6;
  // Fit the whole world inside the frame, reserving room for label ascenders, then
  // fill any leftover width by nudging the scale only as far as the height allows.
  const labelPad = small ? 16 : 22;
  const projection = d3.geoNaturalEarth1()
    .fitExtent([[padL, padY + labelPad], [W - padR, H - padY - labelPad]], countries);
  const fitted = d3.geoPath(projection).bounds(countries);
  const usedW = fitted[1][0] - fitted[0][0], usedH = fitted[1][1] - fitted[0][1];
  const availW = W - padL - padR, availH = H - (padY + labelPad) * 2;
  const grow = Math.max(1, Math.min(availW / usedW, availH / usedH));
  if (grow > 1.001) {
    projection.scale(projection.scale() * grow);
    const b2 = d3.geoPath(projection).bounds(countries);
    const t = projection.translate();
    projection.translate([
      t[0] + (W - (b2[0][0] + b2[1][0])) / 2,
      t[1] + (H - (b2[0][1] + b2[1][1])) / 2
    ]);
  }
  const k = Math.max(0.86, Math.min(1, W / 900));
  const fs = Math.round(11 * k * 10) / 10;
  svg.attr("data-k", k);
  const path = d3.geoPath(projection);

  svg.append("g").selectAll("path").data(countries.features).join("path")
    .attr("d", path)
    .attr("fill", "rgba(251,247,238,0.13)")
    .attr("stroke", "rgba(251,247,238,0.26)")
    .attr("stroke-width", 0.6);

  const o = projection([ORIGIN.lon, ORIGIN.lat]);
  const routes = svg.append("g");

  DEST.forEach((d, i) => {
    const p = projection([d.lon, d.lat]);
    if (!p) return;
    const dd = arc(o, p);
    routes.append("path").attr("d", dd)
      .attr("fill", "none").attr("stroke", "rgba(224,177,78,0.32)").attr("stroke-width", 1.6);
    const line = routes.append("path").attr("d", dd)
      .attr("fill", "none").attr("stroke", "#E0B14E").attr("stroke-width", 1.6)
      .attr("stroke-linecap", "round");
    const len = line.node().getTotalLength();
    line.attr("stroke-dasharray", `${len * 0.16} ${len}`).style("opacity", 0.9);
    const run = () => line.attr("stroke-dashoffset", len * 1.16)
      .transition().duration(2300).ease(d3.easeCubicInOut)
      .attr("stroke-dashoffset", 0)
      .transition().duration(0).delay(500)
      .on("end", run);
    line.transition().delay(260 + i * 150).duration(0).on("end", run);

    routes.append("circle").attr("cx", p[0]).attr("cy", p[1]).attr("r", 7)
      .attr("fill", "rgba(224,177,78,0.16)");
    routes.append("circle").attr("cx", p[0]).attr("cy", p[1]).attr("r", 3)
      .attr("fill", "#E0B14E");
    if (d.gulf !== undefined) {
      // Stack the Gulf and Levant labels in open water below Africa, well clear of
      // Australia, so they stay legible when the map narrows.
      const base = projection([-23, -6]);
      const step = 17 * k;
      const lx = base[0];
      const ly = Math.min(base[1] + d.gulf * step, H - 8 - (5 - d.gulf) * step);
      routes.append("path")
        .attr("d", `M${p[0]},${p[1]} L${lx - 8},${ly - 4}`)
        .attr("fill", "none").attr("stroke", "rgba(251,247,238,0.32)").attr("stroke-width", 0.7);
      routes.append("text").attr("class", "lbl")
        .attr("x", lx).attr("y", ly).attr("text-anchor", "start")
        .style("font-size", fs + "px")
        .text(nm(d));
    } else {
      let ax = d.anchor, ox = d.dx * k, oy = d.dy * k;
      if (ax === "start" && p[0] + 90 * k > W - 8) { ax = "end"; ox = -Math.abs(ox); }
      if (ax === "end" && p[0] - 90 * k < 8) { ax = "start"; ox = Math.abs(ox); }
      routes.append("text").attr("class", "lbl")
        .attr("x", p[0] + ox).attr("y", p[1] + oy)
        .attr("text-anchor", ax)
        .style("font-size", fs + "px")
        .text(nm(d));
    }
  });

  const hub = svg.append("g");
  hub.append("circle").attr("cx", o[0]).attr("cy", o[1]).attr("r", 15)
    .attr("fill", "none").attr("stroke", "rgba(251,247,238,0.42)").attr("stroke-width", 1)
    .attr("stroke-dasharray", "3 4");
  hub.append("circle").attr("cx", o[0]).attr("cy", o[1]).attr("r", 5.5).attr("fill", "#FBF7EE");
  hub.append("text").attr("class", "lbl-origin")
    .attr("x", o[0]).attr("y", o[1] + 32 * k).attr("text-anchor", "middle")
    .style("font-size", Math.round(12.5 * k * 10) / 10 + "px")
    .text(ORIGIN[LANG] || ORIGIN.name);
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  const all = topojson.feature(topo, topo.objects.countries);
  const countries = { type: "FeatureCollection", features: all.features.filter(f => f.properties.name !== "Antarctica") };
  render(countries);
  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => render(countries), 180); });
});
</script>
</body>
</html>
